name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: supplyos_test_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d supplyos_test_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_NAME: "SupplyOS Verification ci-${{ github.run_id }}-${{ github.run_attempt }}"
      APP_ENV: test
      API_V1_PREFIX: /api/v1
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/supplyos_test_ci
      DATABASE_URL_SYNC: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/supplyos_test_ci
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_MINUTES: "30"
      REFRESH_TOKEN_DAYS: "7"
      FRONTEND_URL: http://localhost:3000
      ANTHROPIC_API_KEY: ""
      TEST_API_URL: http://127.0.0.1:8001
      TEST_RUN_ID: "ci-${{ github.run_id }}-${{ github.run_attempt }}"
      SUPPLYOS_ALLOW_API_WRITE_TESTS: "1"
      TEST_ADMIN_EMAIL: verification-owner@example.com
      TEST_DATABASE_URL_SYNC: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/supplyos_test_ci
      SUPPLYOS_POSTGRES_MIGRATION_TESTS: "1"
      SUPPLYOS_OWNED_TEST_ENV: "1"
      FREE_ONLY_MODE: "true"
      APPROVED_FREE_SMTP: "false"
      SMTP_ENABLED: "false"
      COOKIE_SECURE: "false"
      PROOF_STORAGE_BACKEND: local

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate private test credentials
        run: |
          python - <<'PY'
          import os
          import secrets
          values = {
              "JWT_SECRET": secrets.token_urlsafe(48),
              "TEST_ADMIN_PASSWORD": secrets.token_urlsafe(24),
              "SETUP_AUTHORIZATION_TOKEN": secrets.token_urlsafe(48),
          }
          for value in values.values():
              print("::add-mask::" + value)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              for name, value in values.items():
                  environment.write(name + "=" + value + "\n")
              environment.write("PROOF_STORAGE_DIR=" + os.path.join(os.environ["RUNNER_TEMP"], "supplyos-ci-proofs") + "\n")
          PY

      - name: Apply actual schema migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Start backend server
        working-directory: backend
        run: |
          nohup uvicorn server:app --host 0.0.0.0 --port 8001 > /tmp/backend.log 2>&1 &

      - name: Wait for API health
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8001/api/health/deep > /dev/null; then
              echo "API is up"
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start"
          cat /tmp/backend.log
          exit 1

      - name: Initialize setup (idempotent)
        run: |
          python - <<'PY'
          import os
          import requests
          api = os.environ["TEST_API_URL"] + "/api/v1"
          status = requests.get(api + "/setup/status", timeout=10)
          status.raise_for_status()
          if not status.json()["is_setup_complete"]:
              result = requests.post(api + "/setup/initialize", timeout=15, json={
                  "company_name": "SupplyOS verification business",
                  "admin_email": os.environ["TEST_ADMIN_EMAIL"],
                  "admin_password": os.environ["TEST_ADMIN_PASSWORD"],
                  "admin_full_name": "Verification owner",
                  "warehouses": [{"code": "WH-MAIN", "name": "Verification warehouse"}],
              }, headers={"X-Setup-Authorization": os.environ["SETUP_AUTHORIZATION_TOKEN"]})
              if result.status_code != 201:
                  raise SystemExit("Isolated CI setup failed")
          print("Isolated CI setup is ready; credentials are not displayed.")
          PY

      - name: Run backend tests
        working-directory: backend
        run: pytest tests -q

      - name: Print backend log on failure
        if: failure()
        run: cat /tmp/backend.log

  frontend-checks:
    name: Frontend Lint Typecheck Build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      BACKEND_URL: http://127.0.0.1:3801
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Run frontend build
        working-directory: frontend
        run: npm run build

      - name: Install browser test runtime
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run frontend regressions
        working-directory: frontend
        run: |
          npm run test
          PLAYWRIGHT_PRODUCTION=1 NEXT_DIST_DIR=.next npm run test

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-checks]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t supplyos-backend:ci ./backend

      - name: Build frontend image
        run: docker build --build-arg BACKEND_URL=http://supplyos-backend:8001 -t supplyos-frontend:ci ./frontend
